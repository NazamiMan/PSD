name: Deploy MyST Book to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menggunakan Action Resmi MyST untuk Build Website
      - name: Build MyST Site
        uses: executablebooks/mystmd-action@v1
        with:
          path: './PSD-B-main'
          action: 'build'
          html: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Jalur tempat MyST menyimpan hasil kompilasi HTML
          path: './PSD-B-main/_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4