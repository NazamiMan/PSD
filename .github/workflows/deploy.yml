name: Deploy MyST Book to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # MENAMBAHKAN WORKING DIRECTORY KE SUBFOLDER PROYEK
    defaults:
      run:
        working-directory: ./PSD-B-main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Build MyST Site
        run: myst build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengarahkan path artifact ke folder _build/site di dalam subfolder
          path: 'PSD-B-main/_build/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4